name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 for mipsel soft-float musl
    runs-on: ubuntu-latest
    container:
      image: rust:bookworm

    steps:
      - name: Checkout wstunnel repo
        uses: actions/checkout@v4
        with:
          repository: 'erebe/wstunnel'
          ref: 'v11.1.0'
          path: wstunnel

      - name: Checkout home-access-client
        uses: actions/checkout@v4
        with:
          path: output-repo

      - name: Install muslsf toolchain and rust-src
        run: |
          mkdir -p /opt
          curl -sL https://musl.cc/mipsel-linux-muslsf-cross.tgz | tar -xz -C /opt
          rustup toolchain install nightly --component rust-src

      - name: Build static soft-float binary with build-std
        env:
          PATH: /opt/mipsel-linux-muslsf-cross/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          CC_mipsel_unknown_linux_musl: mipsel-linux-muslsf-gcc
          AR_mipsel_unknown_linux_musl: mipsel-linux-muslsf-ar
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER: mipsel-linux-muslsf-gcc
          RUSTFLAGS: "-C target-feature=+crt-static,+soft-float -C link-arg=-msoft-float -C link-arg=-s"
        run: |
          cd wstunnel
          cargo +nightly build -Z build-std=std,panic_abort --release --target mipsel-unknown-linux-musl --package wstunnel-cli
          /opt/mipsel-linux-muslsf-cross/bin/mipsel-linux-muslsf-strip target/mipsel-unknown-linux-musl/release/wstunnel || true
          cp target/mipsel-unknown-linux-musl/release/wstunnel ../output-repo/wstunnel-mipsel
          cd ../output-repo
          ls -lh wstunnel-mipsel

      - name: Push to release-mips branch
        run: |
          cd output-repo
          git config --global --add safe.directory "*"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B release-mips
          git add -f wstunnel-mipsel
          git commit -m "Add compiled static soft-float MIPS wstunnel binary"
          git push -f origin release-mips
