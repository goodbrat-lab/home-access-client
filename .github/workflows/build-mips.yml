name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 for mipsel
    runs-on: ubuntu-latest
    container:
      image: rust:bookworm

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install cross compiler with log
        run: |
          apt-get update > apt.log 2>&1
          apt-get install -y musl-tools gcc-mipsel-linux-gnu upx >> apt.log 2>&1 || true
          which mipsel-linux-gnu-gcc >> apt.log 2>&1 || true

      - name: Push debug log
        run: |
          git config --global --add safe.directory "*"
          git config user.name "Actions Bot"
          git config user.email "bot@github.actions"
          git checkout -B debug-log
          git add -f apt.log
          git commit -m "Add apt.log"
          git push -f origin debug-log