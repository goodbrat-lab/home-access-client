name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 for mipsel
    runs-on: ubuntu-latest
    container:
      image: rust:bullseye

    steps:
      - name: Checkout official wstunnel repo
        uses: actions/checkout@v4
        with:
          repository: 'erebe/wstunnel'
          ref: 'v11.1.0'

      - name: Install cross compiler
        run: |
          apt-get update
          apt-get install -y musl-tools gcc-mipsel-linux-gnu upx-ucl
          rustup target add mipsel-unknown-linux-musl

      - name: Build wstunnel
        env:
          CC_mipsel_unknown_linux_musl: mipsel-linux-gnu-gcc
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER: mipsel-linux-gnu-gcc
        run: |
          cargo build --release --target mipsel-unknown-linux-musl --package wstunnel-cli
          cp target/mipsel-unknown-linux-musl/release/wstunnel ./wstunnel-mipsel
          upx --best --lzma ./wstunnel-mipsel -o ./wstunnel-mipsel-upx || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-mipsel-binaries
          path: |
            wstunnel-mipsel
            wstunnel-mipsel-upx