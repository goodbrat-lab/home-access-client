name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 for mipsel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout official wstunnel repo
        uses: actions/checkout@v4
        with:
          repository: 'erebe/wstunnel'
          ref: 'v11.1.0'

      - name: Compile static binary in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app -w /app rust:1.91-bullseye bash -c "
            set -ex
            apt-get update && apt-get install -y musl-tools gcc-mipsel-linux-gnu upx-ucl
            rustup target add mipsel-unknown-linux-musl
            export CC_mipsel_unknown_linux_musl=mipsel-linux-gnu-gcc
            export CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER=mipsel-linux-gnu-gcc
            cargo build --release --target mipsel-unknown-linux-musl --package wstunnel-cli
            
            # Create compressed and uncompressed versions
            cp target/mipsel-unknown-linux-musl/release/wstunnel /app/wstunnel-mipsel
            upx --best --lzma /app/wstunnel-mipsel -o /app/wstunnel-mipsel-upx || true
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-mipsel-binaries
          path: |
            wstunnel-mipsel
            wstunnel-mipsel-upx