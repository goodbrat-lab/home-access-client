name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 for mipsel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wstunnel repo
        uses: actions/checkout@v4
        with:
          repository: 'erebe/wstunnel'
          ref: 'v11.1.0'

      - name: Install musl.cc cross toolchain and UPX
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          curl -L https://musl.cc/mipsel-linux-muslsf-cross.tgz | sudo tar -xz -C /opt
          rustup target add mipsel-unknown-linux-musl

      - name: Build wstunnel
        run: |
          export PATH=/opt/mipsel-linux-muslsf-cross/bin:$PATH
          cargo build --release --target mipsel-unknown-linux-musl --package wstunnel-cli --config 'target.mipsel-unknown-linux-musl.linker="mipsel-linux-muslsf-gcc"'
          cp target/mipsel-unknown-linux-musl/release/wstunnel ./wstunnel-mipsel
          upx --best --lzma ./wstunnel-mipsel -o ./wstunnel-mipsel-upx || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-mipsel-binaries
          path: |
            wstunnel-mipsel
            wstunnel-mipsel-upx