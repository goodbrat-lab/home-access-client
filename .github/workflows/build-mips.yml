name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 for mipsel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wstunnel repo
        uses: actions/checkout@v4
        with:
          repository: 'erebe/wstunnel'
          ref: 'v11.1.0'

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild and upx
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          cargo install cargo-zigbuild
          rustup target add mipsel-unknown-linux-musl

      - name: Build wstunnel with cargo-zigbuild
        run: |
          cargo zigbuild --release --target mipsel-unknown-linux-musl --package wstunnel-cli
          cp target/mipsel-unknown-linux-musl/release/wstunnel ./wstunnel-mipsel
          upx --best --lzma ./wstunnel-mipsel -o ./wstunnel-mipsel-upx || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-mipsel-binaries
          path: |
            wstunnel-mipsel
            wstunnel-mipsel-upx