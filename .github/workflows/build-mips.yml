name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 for mipsel static
    runs-on: ubuntu-latest
    container:
      image: rust:1.82-bookworm

    steps:
      - name: Checkout wstunnel repo
        uses: actions/checkout@v4
        with:
          repository: 'erebe/wstunnel'
          ref: 'v11.1.0'
          path: wstunnel

      - name: Checkout home-access-client
        uses: actions/checkout@v4
        with:
          path: output-repo

      - name: Install compiler
        run: |
          apt-get update
          apt-get install -y gcc-mipsel-linux-gnu libc6-dev-mipsel-cross
          rustup target add mipsel-unknown-linux-gnu

      - name: Build static binary
        env:
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_GNU_LINKER: mipsel-linux-gnu-gcc
          RUSTFLAGS: "-C target-feature=+crt-static -C link-arg=-static"
        run: |
          cd wstunnel
          cargo build --release --target mipsel-unknown-linux-gnu --package wstunnel-cli
          cp target/mipsel-unknown-linux-gnu/release/wstunnel ../output-repo/wstunnel-mipsel
          cd ../output-repo
          ls -lh wstunnel-mipsel

      - name: Push to release-mips branch
        run: |
          cd output-repo
          git config --global --add safe.directory "*"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B release-mips
          git add -f wstunnel-mipsel
          git commit -m "Add compiled static MIPS wstunnel binary"
          git push -f origin release-mips