name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 with OpenWrt 25.12.6 SDK Toolchain
    runs-on: ubuntu-latest
    container:
      image: rust:bookworm

    steps:
      - name: Checkout wstunnel repo
        uses: actions/checkout@v4
        with:
          repository: 'erebe/wstunnel'
          ref: 'v11.1.0'
          path: wstunnel

      - name: Checkout home-access-client
        uses: actions/checkout@v4
        with:
          path: output-repo

      - name: Run build and capture log
        id: build_step
        run: |
          set +e
          (
            echo "=== INSTALL SYSTEM PACKAGES ==="
            apt-get update
            apt-get install -y zstd curl tar build-essential
            
            echo "=== DOWNLOAD OFFICIAL OPENWRT 25.12.6 TOOLCHAIN ==="
            mkdir -p /opt
            curl -fSL https://downloads.openwrt.org/releases/25.12.6/targets/ramips/mt7620/openwrt-toolchain-25.12.6-ramips-mt7620_gcc-14.3.0_musl.Linux-x86_64.tar.zst -o /opt/toolchain.tar.zst
            tar --zstd -xf /opt/toolchain.tar.zst -C /opt
            rm -f /opt/toolchain.tar.zst

            echo "=== INSPECT TOOLCHAIN FILES ==="
            ls -la /opt
            find /opt -name "*gcc*" -o -name "*clang*" | head -n 30

            TOOLCHAIN_GCC=$(find /opt -name "*mips*gcc" | head -n 1)
            echo "Selected GCC: $TOOLCHAIN_GCC"
            TOOLCHAIN_BIN=$(dirname "$TOOLCHAIN_GCC")
            GCC_NAME=$(basename "$TOOLCHAIN_GCC")
            TARGET_PREFIX=${GCC_NAME%-gcc}
            echo "Target prefix: $TARGET_PREFIX"
            echo "Toolchain bin: $TOOLCHAIN_BIN"

            echo "=== INSTALL RUST NIGHTLY ==="
            rustup toolchain install nightly --component rust-src

            export PATH=$TOOLCHAIN_BIN:$PATH
            export CC_mipsel_unknown_linux_musl="$TOOLCHAIN_GCC"
            export AR_mipsel_unknown_linux_musl="$TOOLCHAIN_BIN/${TARGET_PREFIX}-ar"
            export STRIP="$TOOLCHAIN_BIN/${TARGET_PREFIX}-strip"
            export CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER="$TOOLCHAIN_GCC"
            export RUSTFLAGS="-C target-cpu=mips32r2 -C target-feature=+crt-static -C link-arg=-s"

            echo "=== BUILDING WSTUNNEL FOR OPENWRT MT7620 ==="
            cd wstunnel
            cargo +nightly build -Z build-std=std,panic_abort --release --target mipsel-unknown-linux-musl --package wstunnel-cli
            BUILD_RES=$?
            if [ $BUILD_RES -eq 0 ]; then
              $STRIP target/mipsel-unknown-linux-musl/release/wstunnel || true
              cp target/mipsel-unknown-linux-musl/release/wstunnel ../output-repo/wstunnel-mipsel
              cd ../output-repo
              ls -lh wstunnel-mipsel
              echo "BUILD SUCCESS"
            else
              echo "BUILD FAILED WITH CODE $BUILD_RES"
            fi
          ) > /tmp/build.log 2>&1
          cp /tmp/build.log output-repo/err.log

      - name: Push to release-mips branch
        if: always()
        run: |
          cd output-repo
          git config --global --add safe.directory "*"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B release-mips
          git add err.log wstunnel-mipsel || git add err.log
          git commit -m "Build update: OpenWrt toolchain find fix" || true
          git push -f origin release-mips
