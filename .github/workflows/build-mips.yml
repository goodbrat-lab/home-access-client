name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 for mipsel soft-float musl
    runs-on: ubuntu-latest
    container:
      image: rust:bookworm

    steps:
      - name: Checkout wstunnel repo
        uses: actions/checkout@v4
        with:
          repository: 'erebe/wstunnel'
          ref: 'v11.1.0'
          path: wstunnel

      - name: Checkout home-access-client
        uses: actions/checkout@v4
        with:
          path: output-repo

      - name: Run build and capture log
        id: build_step
        run: |
          set +e
          (
            echo "=== INSTALL TOOLS ==="
            apt-get update
            apt-get install -y curl tar xz-utils
            echo "=== DOWNLOADING TOOLCHAIN ==="
            mkdir -p /opt
            curl -fSL https://musl.cc/mipsel-linux-muslsf-cross.tgz -o /opt/toolchain.tgz
            ls -lh /opt/toolchain.tgz
            tar -xzf /opt/toolchain.tgz -C /opt
            ls -la /opt/mipsel-linux-muslsf-cross/bin
            echo "=== INSTALL RUST NIGHTLY ==="
            rustup toolchain install nightly --component rust-src
            export PATH=/opt/mipsel-linux-muslsf-cross/bin:$PATH
            export CC_mipsel_unknown_linux_musl=mipsel-linux-muslsf-gcc
            export AR_mipsel_unknown_linux_musl=mipsel-linux-muslsf-ar
            export CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER=mipsel-linux-muslsf-gcc
            export RUSTFLAGS="-C target-feature=+crt-static,+soft-float -C link-arg=-msoft-float -C link-arg=-s"
            echo "=== BUILDING WSTUNNEL ==="
            cd wstunnel
            cargo +nightly build -Z build-std=std,panic_abort --release --target mipsel-unknown-linux-musl --package wstunnel-cli
            BUILD_RES=$?
            if [ $BUILD_RES -eq 0 ]; then
              /opt/mipsel-linux-muslsf-cross/bin/mipsel-linux-muslsf-strip target/mipsel-unknown-linux-musl/release/wstunnel || true
              cp target/mipsel-unknown-linux-musl/release/wstunnel ../output-repo/wstunnel-mipsel
              echo "BUILD SUCCESS"
            else
              echo "BUILD FAILED WITH CODE $BUILD_RES"
            fi
          ) > /tmp/build.log 2>&1
          cp /tmp/build.log output-repo/err.log

      - name: Push to release-mips branch
        if: always()
        run: |
          cd output-repo
          git config --global --add safe.directory "*"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B release-mips
          git add err.log wstunnel-mipsel || git add err.log
          git commit -m "Build update: binary or log" || true
          git push -f origin release-mips
