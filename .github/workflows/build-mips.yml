name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 for mipsel static
    runs-on: ubuntu-latest
    container:
      image: rust:bookworm

    steps:
      - name: Checkout home-access-client
        uses: actions/checkout@v4
        with:
          path: output-repo

      - name: Install compiler
        run: |
          apt-get update > /tmp/err.log 2>&1
          apt-get install -y gcc-mipsel-linux-gnu libc6-dev-mipsel-cross upx >> /tmp/err.log 2>&1 || true
          rustup target add mipsel-unknown-linux-gnu >> /tmp/err.log 2>&1 || true

      - name: Push error log
        if: always()
        run: |
          cd output-repo
          git config --global --add safe.directory "*"
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B release-mips
          cp /tmp/err.log ./err.log || true
          git add -f err.log
          git commit -m "Error log" || true
          git push -f origin release-mips