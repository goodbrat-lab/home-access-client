name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 for mipsel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wstunnel repo
        uses: actions/checkout@v4
        with:
          repository: 'erebe/wstunnel'
          ref: 'v11.1.0'
          path: wstunnel-src

      - name: Checkout home-access-client repo
        uses: actions/checkout@v4
        with:
          path: my-repo

      - name: Install cross and upx
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin

      - name: Build with cross
        run: |
          cd wstunnel-src
          cross build --target mipsel-unknown-linux-musl --release --package wstunnel-cli > ../my-repo/build.log 2>&1 || true
          if [ -f target/mipsel-unknown-linux-musl/release/wstunnel ]; then
            cp target/mipsel-unknown-linux-musl/release/wstunnel ../my-repo/wstunnel-mipsel
            upx --best --lzma ../my-repo/wstunnel-mipsel -o ../my-repo/wstunnel-mipsel-upx || true
          fi

      - name: Push output to debug-log branch
        run: |
          cd my-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B debug-log
          git add -f build.log wstunnel-mipsel wstunnel-mipsel-upx || true
          git commit -m "Upload build log and binary" || true
          git push -f origin debug-log