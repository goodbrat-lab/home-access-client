name: Build wstunnel for OpenWrt MIPS

on:
  push:
    paths:
      - '.github/workflows/build-mips.yml'
  workflow_dispatch:

jobs:
  build:
    name: Cross-compile wstunnel v11.1.0 for mipsel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wstunnel repo
        uses: actions/checkout@v4
        with:
          repository: 'erebe/wstunnel'
          ref: 'v11.1.0'

      - name: Install cross and upx
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin

      - name: Build with cross
        run: |
          cross build --target mipsel-unknown-linux-musl --release --package wstunnel-cli
          cp target/mipsel-unknown-linux-musl/release/wstunnel ./wstunnel-mipsel
          upx --best --lzma ./wstunnel-mipsel -o ./wstunnel-mipsel-upx || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-mipsel-binaries
          path: |
            wstunnel-mipsel
            wstunnel-mipsel-upx